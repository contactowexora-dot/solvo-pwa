<!DOCTYPE html>
<html lang="es-PE" data-tema="claro">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover es lo que hace que env(safe-area-inset-*) devuelva algo distinto de
     cero en iOS. Sin él, la barra flotante se mete debajo del indicador de inicio. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F5">
<meta name="description" content="Solvo — tus finanzas personales, resueltas.">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Solvo">
<title>Solvo</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icono.svg" type="image/svg+xml">
<!-- iOS ignora los iconos del manifiesto y solo entiende apple-touch-icon en PNG. Sin ese
     archivo usa una captura de la pantalla como icono, que queda feo pero no rompe nada.
     Convertir assets/icono.svg a 180×180 PNG y descomentar esta línea. -->
<!-- <link rel="apple-touch-icon" href="assets/icono-180.png"> -->

<!-- El tema se aplica antes de pintar. Si esperase a app.js, quien tiene el tema oscuro
     vería un destello blanco en cada carga. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('solvo.tema') || 'auto';
      var oscuro = t === 'oscuro' ||
        (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
      document.querySelector('meta[name="theme-color"]').content = oscuro ? '#0B0B0D' : '#F4F4F5';
    } catch (e) { /* modo privado sin localStorage: se queda en claro */ }
  })();
</script>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/componentes.css">
</head>
<body>

<!-- El sprite se inyecta aquí al arrancar (Manual 3 §6.2). Va por fetch y no inline en el
     HTML para que el Service Worker lo cachee como un archivo propio y no infle el
     documento en cada carga. -->
<div id="sprite" hidden></div>

<div id="app">
  <div class="cargando-pantalla">
    <svg class="ico ico-24 girando" aria-hidden="true"><use href="#i-loader-circle"/></svg>
    <span class="solo-lector">Cargando Solvo</span>
  </div>
</div>

<noscript>
  <div style="padding:24px;font:400 15px/1.5 system-ui">
    <h1 style="font-size:28px;margin:0 0 8px">Solvo necesita JavaScript</h1>
    <p>Actívalo en tu navegador para continuar.</p>
  </div>
</noscript>

<script>
  /* El sprite se carga antes que la app: un ícono que llega tarde deja huecos visibles
     en la primera pintada. Si falla, la app arranca igual —los <use> quedan vacíos pero
     nada se rompe— porque quedarse en la pantalla de carga sería peor. */
  (function () {
    fetch('assets/icons-sprite.svg')
      .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error(r.status)); })
      .then(function (svg) { document.getElementById('sprite').innerHTML = svg; })
      .catch(function (e) { console.warn('Sprite de íconos no cargado:', e.message); });
  })();
</script>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/graficos.js"></script>
<script src="js/campos.js"></script>
<script src="js/formularios.js"></script>
<script src="js/app.js"></script>
<script src="js/form-gasto.js"></script>
<script src="js/form-ingreso.js"></script>
<script src="js/form-mover.js"></script>
<script src="js/form-producto.js"></script>
<script src="js/form-objetivo.js"></script>
<script src="js/inicio.js"></script>
<script src="js/productos.js"></script>
<script src="js/movimientos.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/objetivos.js"></script>
</body>
</html>
