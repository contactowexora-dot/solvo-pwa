<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Solvo">
  <!--
    Icono de Solvo. Deliberadamente austero: la marca del producto es la disciplina, no un
    logotipo (Manual 3 §1.3). Tinta sobre nada, con el margen de seguridad del 20% que exige
    una máscara circular de Android — el trazo queda dentro del 80% central.
  -->
  <rect width="512" height="512" rx="112" fill="#0E0E10"/>
  <!--
    La S se dibuja como trazo, no como texto: un <text> depende de que la fuente exista en
    el dispositivo, y en el icono de una app instalada eso no se puede asumir.
  -->
  <path d="M316 176c-14-20-38-32-64-32-38 0-66 22-66 54 0 30 22 44 62 54 46 12 74 30 74 70 0 38-32 62-76 62-30 0-56-12-72-34"
        fill="none" stroke="#FFFFFF" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
